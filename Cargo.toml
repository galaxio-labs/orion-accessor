[package]
name = "orion-accessor"
authors = ["wukong<sec-wukong@outlook.com>"]
edition = "2024"
version = "0.6.0"
description = "Unified accessor layer for HTTP, Git, and local resources with redirect rules, proxy control, and env-aware templating."
license = "MIT"
keywords = ["http", "git", "redirect", "proxy", "update"]
categories = ["config", "network-programming"]
repository = "https://github.com/galaxy-sec/orion-accessor"

[dependencies]
orion-error = "0.6"
orion_conf =  { version = "0.5", features = ["yaml"]}
#orion-variate = "~0.10"
orion-variate = "0.11"
 #orion_conf = "~0.1"
orion-infra =  "0.5"
env_logger = "0.11"
thiserror = "2.0"
log = "0.4"
git2 = { version = "0.20", features = ["vendored-openssl"] }
home = "0.5"
toml = "1.0"
serde = "1.0"
serde_yaml = "0.9"
winnow = "0.7"
derive_more = { version = "2.0", features = ["full"] }
tokio = { version = "1.45", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart"] }
url = "2.5"
os_info = "3"
serde_derive = "~1.0"
anyhow = "1.0"
serde_json = "1.0"
fs_extra = "1.3"
indexmap = { version = "2.11", features = ["serde"] }
derive-getters = "0.5.0"
indicatif = "0.18"
#futures = "0.3"
#async-stream = "0.3"
#tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
bytes = "1.0"
contracts = "0.6"
tracing = "0.1"
getset = "0.1.6"
wildmatch = "2.4"
#handlebars = "6.3"
walkdir = "2.5"
async-trait = "0.1"
scopeguard = "1.2.0"
#lazy_static = "~1.5"
# env_logger = "~0.11"
flexi_logger = "0.31"
tar = "0.4"
flate2 = "1.1"
http-body = "1.0"
http = "1.3"
futures-core = "0.3.31"


#console = "~0.15"
[dev-dependencies]
rstest = "0.26.0"
tempfile = "3.21"
mockito = "1.7"
